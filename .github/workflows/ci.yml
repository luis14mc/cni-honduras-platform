name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-github-actions-not-for-production
      POSTGRES_DB: cni_test
      POSTGRES_USER: cni
      POSTGRES_PASSWORD: cni
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cni_test
          POSTGRES_USER: cni
          POSTGRES_PASSWORD: cni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cni -d cni_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: No pending migrations
        run: python manage.py makemigrations --check

      - name: Run tests
        run: python manage.py test --verbosity=2

  strapi-ci:
    name: strapi-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-strapi
    env:
      NODE_ENV: production
      APP_KEYS: ci-key-a,ci-key-b
      API_TOKEN_SALT: ci-api-token-salt-not-secret
      ADMIN_JWT_SECRET: ci-admin-jwt-not-secret
      TRANSFER_TOKEN_SALT: ci-transfer-salt-not-secret
      ENCRYPTION_KEY: ci-encryption-key-32charsxxxxx
      JWT_SECRET: ci-jwt-secret-not-secret
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: cni_strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: "false"
      STRAPI_PLUGIN_I18N_INIT_LOCALE_CODE: es
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cms-strapi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build
